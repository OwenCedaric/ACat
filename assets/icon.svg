<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#f5f0e6"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#222326" stroke-width="8"/>
  
  <!-- Red Cinnabar Seal Stamp in Top Right -->
  <g transform="translate(360, 48) rotate(6)">
    <rect width="90" height="90" rx="8" fill="#b83828" stroke="#ffffff" stroke-width="4"/>
    <text x="45" y="40" font-family="'Songti SC', 'SimSun', serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">素</text>
    <text x="45" y="74" font-family="'Songti SC', 'SimSun', serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">墨</text>
  </g>

  <!-- Ground tile brush arc -->
  <path d="M 60 410 Q 256 425 452 410" fill="none" stroke="#2b2d30" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Cat Body -->
  <g transform="translate(190, 240)">
    <!-- Swishing Brush Tail -->
    <path d="M -50 40 C -90 35 -120 10 -110 -30 C -105 -50 -85 -60 -75 -45 C -65 -30 -80 0 -50 20" 
          fill="none" stroke="#1c1b1a" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Torso and Back -->
    <path d="M -50 40 Q -30 -30 30 -20 Q 70 -10 65 30 Q 15 55 -50 40 Z" fill="#1c1b1a"/>
    
    <!-- Head and Ears -->
    <circle cx="65" cy="-20" r="32" fill="#1c1b1a"/>
    <!-- Left Ear -->
    <polygon points="45,-30 40,-68 62,-44" fill="#1c1b1a"/>
    <polygon points="47,-32 44,-60 59,-42" fill="#d77d73" opacity="0.6"/>
    <!-- Right Ear -->
    <polygon points="68,-44 86,-68 85,-28" fill="#1c1b1a"/>
    
    <!-- Amber Eye -->
    <ellipse cx="74" cy="-22" rx="8" ry="9" fill="#e8ba45"/>
    <ellipse cx="75" cy="-22" rx="3" ry="8" fill="#111111"/>
    <circle cx="72" cy="-25" r="2" fill="#ffffff"/>
    
    <!-- Whiskers -->
    <line x1="82" y1="-14" x2="115" y2="-18" stroke="#f0ede6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="82" y1="-8" x2="112" y2="-4" stroke="#f0ede6" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Paws -->
    <ellipse cx="45" cy="48" rx="10" ry="8" fill="#1c1b1a"/>
    <ellipse cx="-35" cy="48" rx="11" ry="8" fill="#1c1b1a"/>
    <ellipse cx="45" cy="52" rx="6" ry="4" fill="#f5f0e6" opacity="0.8"/>
    <ellipse cx="-35" cy="52" rx="7" ry="4" fill="#f5f0e6" opacity="0.8"/>
  </g>
  
  <!-- Fading Plum-blossom paw prints on ground -->
  <g transform="translate(100, 395) scale(1.4)" opacity="0.45" fill="#222326">
    <ellipse cx="0" cy="0" rx="6" ry="4"/>
    <circle cx="-5" cy="-6" r="2.2"/>
    <circle cx="-2" cy="-8" r="2.4"/>
    <circle cx="2" cy="-8" r="2.4"/>
    <circle cx="5" cy="-6" r="2.2"/>
  </g>
</svg>
